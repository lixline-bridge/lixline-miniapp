<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ликс-Лайн — каталог</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf9f4;
    --paper-dim:#f1efe6;
    --ink:#161b22;
    --ink-soft:#3d4451;
    --muted:#7a8090;
    --amber:#c9820c;
    --amber-deep:#a3690a;
    --line:#d9d5c7;
    --ok:#2f7d5b;
    --brand-red:#de2126;
    --brand-red-deep:#a8181c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;position:relative;}

  /* ---------- Header ---------- */
  header{
    background:var(--brand-red);
    color:var(--paper);
    padding:18px 18px 14px;
    position:sticky; top:0; z-index:20;
  }
  .barcode{
    display:flex; align-items:flex-end; gap:2px; height:16px; margin-bottom:10px; opacity:.8;
  }
  .barcode span{display:block; background:rgba(255,255,255,.75); width:2px;}
  .brand-row{display:flex; align-items:center; justify-content:space-between;}
  .brand-left{display:flex; align-items:center; gap:10px;}
  .logo-badge{
    width:38px; height:38px; flex:0 0 auto; background:var(--paper);
    border-radius:10px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .logo-badge img{width:24px; height:auto; display:block;}
  .brand{font-weight:800; font-size:19px; letter-spacing:.2px;}
  .brand small{display:block; font-weight:500; font-size:11.5px; color:rgba(255,255,255,.8); margin-top:2px;}
  .updated{font-family:var(--mono); font-size:10.5px; color:rgba(255,255,255,.7);}

  /* ---------- Category tabs ---------- */
  nav.tabs{
    display:flex; gap:6px; overflow-x:auto; padding:12px 14px 0;
    background:var(--paper); position:sticky; top:64px; z-index:15;
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.subtabs{
    top:108px; padding:9px 14px; border-bottom:1px solid var(--line);
    gap:7px;
  }
  .chip{
    flex:0 0 auto; padding:6px 12px; font-size:12px; font-weight:600;
    color:var(--ink-soft); background:var(--paper-dim); border:1px solid var(--line);
    border-radius:99px; cursor:pointer; white-space:nowrap;
  }
  .chip.active{color:var(--paper); background:var(--ink); border-color:var(--ink);}
  .tab{
    flex:0 0 auto; padding:8px 13px 10px; font-size:13px; font-weight:600;
    color:var(--muted); background:transparent; border:none; cursor:pointer;
    border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tab.active{color:var(--ink); border-bottom-color:var(--brand-red);}

  /* ---------- Product list ---------- */
  main{flex:1; padding:6px 14px 90px;}
  .row{
    display:flex; align-items:center; gap:12px;
    padding:14px 2px; border-bottom:1px dashed var(--line);
    cursor:pointer;
  }
  .row:active{background:var(--paper-dim);}
  .icon{
    width:42px; height:42px; flex:0 0 auto; border-radius:9px;
    background:var(--paper-dim); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
    position:relative; overflow:hidden;
  }
  .icon img.thumb{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; border-radius:8px;
  }
  .icon svg{width:21px; height:21px;}
  .info{flex:1; min-width:0;}
  .info .name{font-size:14.5px; font-weight:700; line-height:1.3;}
  .info .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .stock-badge{display:inline-block; font-size:10.5px; font-weight:600; margin-top:4px; color:var(--ok);}
  .stock-badge.out{color:#b34b4b;}
  .price{
    font-family:var(--mono); font-weight:700; font-size:14.5px; color:var(--amber-deep);
    white-space:nowrap; padding-left:6px;
  }

  .empty{text-align:center; padding:60px 20px; color:var(--muted); font-size:13.5px;}

  /* ---------- Product detail sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(22,27,34,.45);
    opacity:0; pointer-events:none; transition:opacity .18s ease; z-index:30;
  }
  .sheet-backdrop.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:50%; bottom:0; transform:translate(-50%,100%);
    width:100%; max-width:480px; background:var(--paper);
    border-radius:16px 16px 0 0; padding:20px 20px 22px; z-index:31;
    transition:transform .22s cubic-bezier(.2,.8,.2,1);
    max-height:82vh; overflow-y:auto;
    box-shadow:0 -8px 30px rgba(0,0,0,.18);
  }
  .sheet.show{transform:translate(-50%,0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 16px;}
  .sheet h2{font-size:17px; margin:0 0 6px; font-weight:800;}
  .sheet .sku{font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:12px;}
  .sheet .hero-img{
    width:100%; max-height:220px; object-fit:contain; background:var(--paper-dim);
    border-radius:12px; border:1px solid var(--line); margin-bottom:14px; display:block;
  }
  .sheet p.desc{
    font-size:13.5px; line-height:1.55; color:var(--ink-soft); margin:0 0 4px;
    display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden;
  }
  .sheet p.desc.expanded{display:block; -webkit-line-clamp:unset; overflow:visible;}
  .read-more{
    background:none; border:none; padding:0; margin:0 0 18px; cursor:pointer;
    font-family:'Manrope',sans-serif; font-size:12.5px; font-weight:700; color:var(--amber-deep);
  }
  .site-link{
    display:flex; align-items:center; justify-content:center; gap:6px;
    text-decoration:none; color:var(--ink-soft);
  }
  .site-link svg{width:14px; height:14px;}
  .sheet .price-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); margin-bottom:16px;
  }
  .sheet .price-row .big-price{font-family:var(--mono); font-size:22px; font-weight:800; color:var(--amber-deep);}
  .btn{
    display:block; width:100%; text-align:center; padding:13px; border-radius:10px;
    border:none; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .btn-primary{background:var(--amber); color:var(--ink);}
  .btn-primary:active{background:var(--amber-deep);}
  .btn-ghost{background:transparent; color:var(--muted); margin-top:10px; font-weight:600;}

  /* ---------- Order form ---------- */
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px;
    font-family:'Manrope',sans-serif; font-size:14px; background:#fff; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .confirm{
    text-align:center; padding:10px 0 4px;
  }
  .confirm .stamp{
    display:inline-flex; align-items:center; justify-content:center;
    width:52px; height:52px; border-radius:50%; border:2px solid var(--ok); color:var(--ok);
    font-size:26px; margin-bottom:14px;
  }
  .confirm h3{margin:0 0 6px; font-size:16px;}
  .confirm p{margin:0; font-size:13px; color:var(--muted); line-height:1.5;}

  .demo-banner{
    font-family:var(--mono); font-size:10.5px; color:#8a6a1f; background:#fdf3dd;
    border:1px dashed #e3c581; border-radius:8px; padding:8px 10px; margin:10px 14px 0;
  }
  #debugBanner{
    position:fixed; top:0; left:0; right:0; z-index:9999; margin:0;
    border-radius:0; font-size:10px; word-break:break-all; padding:6px 10px;
  }
</style>
</head>

const API_BASE = 'https://lixline-bridge-server.onrender.com';

   Определяем, в каком мессенджере открыто приложение — MAX или Telegram —

------------------------------------------------------------------------- */
function initPlatformBridge() {
  // MAX: https://dev.max.ru/docs/webapps/bridge

    try {
      const data = window.WebApp.initDataUnsafe;
      if (data && data.user) {
        state.platform = 'max';
        state.platformUser = data.user; // { id, first_name, last_name, username, ... }
      }
    } catch (e) {
      console.warn('MAX Bridge: не удалось прочитать initDataUnsafe', e);
    }
  }

  // Telegram: https://core.telegram.org/bots/webapps
  if (!state.platform && window.Telegram && window.Telegram.WebApp) {
    try {
      window.Telegram.WebApp.ready();
      const data = window.Telegram.WebApp.initDataUnsafe;
      if (data && data.user) {
        state.platform = 'telegram';
        state.platformUser = data.user; // { id, first_name, last_name, username, ... }
      }
    } catch (e) {
      console.warn('Telegram WebApp: не удалось прочитать initDataUnsafe', e);
    }
  }

  // ВРЕМЕННО: показываем на экране, что именно определилось — уберём,
  // как только разберёмся с Telegram
  const dbg = document.getElementById('debugBanner');
  if (dbg) {
    dbg.style.display = 'block';
    dbg.textContent =
      'debug v2: window.WebApp=' + (!!window.WebApp) +
      ' | window.Telegram=' + (!!window.Telegram) +
      ' | window.Telegram.WebApp=' + (!!(window.Telegram && window.Telegram.WebApp)) +
      ' | platform=' + state.platform +
      ' | userId=' + (state.platformUser ? state.platformUser.id : 'нет') +
      ' | write=' + (state.platformUser ? state.platformUser.allows_write_to_pm : 'нет');
  }
}

/* Демо-данные — реалистичный срез каталога Ликс-Лайн, чтобы приложение
   было видно и кликабельно уже сейчас, до подключения реального сайта. */
const DEMO_DATA = {

    { id: 11, name: 'Консультация по кассовой дисциплине', sku: 'SRV-CONS', description: 'Часовая консультация: разбор требований 54-ФЗ, проверка настроек кассы.', price: 2000, in_stock: true, category_ids: [5] },
  ],
};

let state = { categories: [], products: [], activeCategory: null, activeSubcategory: null, isDemo: true, platform: null, platformUser: null };

function escapeAttr(str){
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function money(v){
  return new Intl.NumberFormat('ru-RU').format(v) + ' ₽';
}

function categoryNameFor(catIds){
  const id = catIds && catIds[0];
  if (id == null) return '';
  const cat = state.categories.find(c => Number(c.category_id) === Number(id));
  return cat ? cat.name.toLowerCase() : '';
}

// категория верхнего уровня — либо явный корень (parent_id 0),
// либо "сирота", чей родитель отключён и не попал в фид
function getTopLevelCategories(){
  const ids = new Set(state.categories.map(c => Number(c.category_id)));
  return state.categories.filter(c => Number(c.parent_id) === 0 || !ids.has(Number(c.parent_id)));
}
function getChildren(catId){
  return state.categories.filter(c => Number(c.parent_id) === Number(catId));
}
// товары раздела: свои + товары всех его подкатегорий
function productsInBranch(catId){
  const ids = [Number(catId), ...getChildren(catId).map(c => Number(c.category_id))];
  return state.products.filter(p => p.category_ids.some(id => ids.includes(id)));
}

function iconFor(catIds){
  // подбираем иконку по ключевым словам в названии категории товара —
  // категории в разных магазинах OpenCart имеют разные ID, поэтому
  // завязываться на конкретные числа ненадёжно
  const name = categoryNameFor(catIds);
  const icons = {
    kassa: '<path d="M3 8h18v11H3z"/><path d="M3 8l2-4h14l2 4"/><path d="M9 14h6"/>',
    vesy: '<path d="M4 20h16"/><circle cx="12" cy="10" r="6"/><path d="M9 20l3-4 3 4"/>',
    scan: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/>',
    marking: '<rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.4"/><path d="M13 9h4M9 15l6-6"/>',
    service: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
    default: '<rect x="4" y="7" width="16" height="13" rx="2"/><path d="M4 7l3-4h10l3 4"/><path d="M9 11h6"/>',
  };
  let key = 'default';
  if (/касс/.test(name)) key = 'kassa';
  else if (/вес/.test(name)) key = 'vesy';
  else if (/скан|штрих/.test(name)) key = 'scan';
  else if (/маркиров|знак|честн/.test(name)) key = 'marking';
  else if (/егаис|консульт|инфо|1с/.test(name)) key = 'service';

  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${icons[key]}</svg>`;
}

function renderBarcode(){
  const el = document.getElementById('barcode');
  let html = '';
  for (let i=0;i<28;i++){
    const w = [1,1,2,1,3,1][i % 6];
    const h = 8 + (i % 5) * 2;
    html += `<span style="width:${w}px;height:${h}px;"></span>`;
  }
  el.innerHTML = html;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  const top = getTopLevelCategories();
  const all = [{ category_id: null, name: 'Все' }, ...top];
  tabs.innerHTML = all.map(c => `
    <button class="tab ${state.activeCategory === c.category_id ? 'active' : ''}" data-cat="${c.category_id}">
      ${c.name}
    </button>
  `).join('');
  tabs.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.cat;
      state.activeCategory = v === 'null' ? null : Number(v);
      state.activeSubcategory = null;
      renderTabs();
      renderList();
    });
  });

  renderSubtabs();
}

function renderSubtabs(){
  const subtabs = document.getElementById('subtabs');
  const children = state.activeCategory ? getChildren(state.activeCategory) : [];

  if (!children.length){
    subtabs.style.display = 'none';
    subtabs.innerHTML = '';
    return;
  }

  subtabs.style.display = 'flex';
  const chips = [{ category_id: null, name: 'Весь раздел' }, ...children];
  subtabs.innerHTML = chips.map(c => `
    <button class="chip ${state.activeSubcategory === c.category_id ? 'active' : ''}" data-cat="${c.category_id}">
      ${c.name}
    </button>
  `).join('');
  subtabs.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.cat;
      state.activeSubcategory = v === 'null' ? null : Number(v);
      renderSubtabs();
      renderList();
    });
  });
}

function renderList(){
  const list = document.getElementById('list');
  let items;
  if (state.activeSubcategory){
    items = state.products.filter(p => p.category_ids.includes(state.activeSubcategory));
  } else if (state.activeCategory){
    items = productsInBranch(state.activeCategory);
  } else {
    items = state.products;
  }

  if (!items.length){
    list.innerHTML = `<div class="empty">В этой категории пока пусто</div>`;
    return;
  }

  list.innerHTML = items.map(p => `
    <div class="row" data-id="${p.id}">
      <div class="icon">
        ${iconFor(p.category_ids)}
        ${p.image ? `<img class="thumb" src="${escapeAttr(p.image)}" alt="" loading="lazy" />` : ''}
      </div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="sub">${p.sku}</div>
        <div class="stock-badge ${p.in_stock ? '' : 'out'}">${p.in_stock ? 'В наличии' : 'Нет в наличии'}</div>
      </div>
      <div class="price">${money(p.price)}</div>
    </div>
  `).join('');

  // если фото не загрузилось — просто скрываем его, под ним уже есть иконка-заглушка
  list.querySelectorAll('.icon img.thumb').forEach(img => {
    img.addEventListener('error', () => { img.style.display = 'none'; });
  });

  list.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', () => openProduct(Number(row.dataset.id)));
  });
}

function openProduct(id){
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  const sheet = document.getElementById('sheet');
  const descId = 'desc-' + p.id;
  const isLong = (p.description || '').length > 160;

  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    ${p.image ? `<img class="hero-img" src="${escapeAttr(p.image)}" alt="" onerror="this.remove()" />` : ''}
    <h2>${p.name}</h2>
    <div class="sku">Артикул ${p.sku}</div>
    <p class="desc" id="${descId}">${p.description || 'Описание уточняется — напишите нам, ответим в течение дня.'}</p>
    ${isLong ? `<button class="read-more" id="readMoreBtn">Читать далее</button>` : ''}
    <div class="price-row">
      <span class="big-price">${money(p.price)}</span>
      <span class="stock-badge ${p.in_stock ? '' : 'out'}">${p.in_stock ? 'В наличии' : 'Нет в наличии'}</span>
    </div>
    <button class="btn btn-primary" id="orderBtn">Оформить заявку</button>
    ${p.url ? `
      <a class="btn btn-ghost site-link" href="${escapeAttr(p.url)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M10 14L20 4"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6"/></svg>
        Смотреть на сайте
      </a>
    ` : ''}
  `;
  if (isLong){
    const descEl = sheet.querySelector('#' + descId);
    sheet.querySelector('#readMoreBtn').addEventListener('click', (e) => {
      const expanded = descEl.classList.toggle('expanded');
      e.target.textContent = expanded ? 'Свернуть' : 'Читать далее';
    });
  }
  sheet.querySelector('#orderBtn').addEventListener('click', () => openOrderForm(p));
  showSheet();
}

/* Телефон: при нажатии в поле сразу появляется настоящий «+7»,
   дальше клиент вводит 978..., номер сам оформляется как +7 978 701-01-93 */
function formatPhone(value){
  let d = String(value).replace(/\D/g, '');
  if (d.startsWith('8')) d = '7' + d.slice(1);
  if (!d.startsWith('7')) d = '7' + d;
  d = d.slice(0, 11);
  let out = '+7';
  if (d.length > 1) out += ' ' + d.slice(1, 4);
  if (d.length > 4) out += ' ' + d.slice(4, 7);
  if (d.length > 7) out += '-' + d.slice(7, 9);
  if (d.length > 9) out += '-' + d.slice(9, 11);
  return out;
}
function setupPhoneInput(el){
  if (!el) return;
  el.addEventListener('focus', () => {
    if (!el.value) el.value = '+7';
    setTimeout(() => { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }, 0);
  });
  el.addEventListener('input', () => { el.value = formatPhone(el.value); });
}

function openOrderForm(p){
  const sheet = document.getElementById('sheet');
  const prefillName = state.platformUser ? [state.platformUser.first_name, state.platformUser.last_name].filter(Boolean).join(' ') : '';
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <h2>Заявка на «${p.name}»</h2>
    <div class="sku">${money(p.price)}</div>
    <div class="field">
      <label>Ваше имя</label>
      <input type="text" id="fName" placeholder="Как к вам обращаться" value="${escapeAttr(prefillName)}" />
    </div>
    <div class="field">
      <label>Телефон</label>
      <input type="tel" id="fPhone" inputmode="tel" autocomplete="tel" placeholder="+7 ___ ___-__-__" />
    </div>
    <div class="field">
      <label>Комментарий (необязательно)</label>
      <textarea id="fComment" placeholder="Например, удобное время для звонка"></textarea>
    </div>
    <button class="btn btn-primary" id="submitOrder">Отправить заявку</button>
    <button class="btn btn-ghost" id="backBtn">Назад</button>
  `;
  sheet.querySelector('#backBtn').addEventListener('click', () => openProduct(p.id));
  sheet.querySelector('#submitOrder').addEventListener('click', () => submitOrder(p));
  setupPhoneInput(sheet.querySelector('#fPhone'));
}

/* Telegram: бот не может писать клиенту, пока тот не разрешил. Спрашиваем
   один раз, перед отправкой заявки, со своим понятным пояснением. */
function needsWriteAccess(){
  const tg = window.Telegram && window.Telegram.WebApp;
  return state.platform === 'telegram' && state.platformUser &&
    state.platformUser.allows_write_to_pm !== true &&
    tg && typeof tg.requestWriteAccess === 'function' &&
    typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast('6.9');
}

function submitOrder(p){
  const name = document.getElementById('fName').value.trim();
  const phoneDigits = document.getElementById('fPhone').value.replace(/\D/g, '');
  const comment = document.getElementById('fComment').value.trim();

  if (!name){
    alert('Укажите, как к вам обращаться');
    return;
  }
  if (phoneDigits.length < 11){
    alert('Введите номер телефона полностью, например +7 978 701-01-93');
    return;
  }
  const phone = '+' + phoneDigits;

  if (needsWriteAccess()){
    showWriteAccessStep(p, name, phone, comment);
    return;
  }
  sendOrder(p, name, phone, comment);
}

function showWriteAccessStep(p, name, phone, comment){
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <div class="confirm">
      <h3>Разрешить боту Ликс-Лайн писать вам?</h3>
      <p>Тогда у вас останется история заказов: в чате с ботом будет подтверждение заявки и ответы менеджера.</p>
      <button class="btn btn-primary" id="allowBtn" style="margin-top:16px;">Разрешить и отправить заявку</button>
      <button class="btn btn-ghost" id="skipBtn" style="margin-top:8px;">Отправить без чата</button>
    </div>
  `;
  sheet.querySelector('#allowBtn').addEventListener('click', () => {
    let done = false;
    const go = () => { if (!done){ done = true; sendOrder(p, name, phone, comment); } };
    try {
      window.Telegram.WebApp.requestWriteAccess(go);
    } catch (e) {
      go();
    }
  });
  sheet.querySelector('#skipBtn').addEventListener('click', () => sendOrder(p, name, phone, comment));
}

async function sendOrder(p, name, phone, comment){
  const payload = {
    name, phone, comment,
    items: [{ id: p.id, name: p.name, price: p.price }],
    // если приложение открыто внутри MAX — боту есть кому ответить прямо в чат
    platform: state.platform,
    platform_user_id: state.platformUser ? state.platformUser.id : null,
  };

  if (!API_BASE){
    showConfirm(true, false);
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/api/order`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    showConfirm(res.ok, !!state.platformUser);
  } catch (e) {
    showConfirm(false, false);
  }
}

function showConfirm(ok, isMaxChat){
  const sheet = document.getElementById('sheet');
  const successText = isMaxChat
    ? 'Мы напишем подтверждение прямо в этот чат с ботом — там же можно будет уточнить детали.'
    : 'Мы свяжемся с вами в ближайшее время.';
  sheet.innerHTML = ok ? `
    <div class="confirm">
      <div class="stamp">✓</div>
      <h3>Заявка принята</h3>
      <p>${API_BASE ? successText : 'Демо-режим: заявка не отправлена по-настоящему — бридж-сервер ещё не подключён. Когда подключим, здесь будет реальная отправка.'}</p>
      <button class="btn btn-ghost" id="closeBtn" style="margin-top:16px;">Закрыть</button>
    </div>
  ` : `
    <div class="confirm">
      <div class="stamp" style="border-color:#b34b4b;color:#b34b4b;">!</div>
      <h3>Не получилось отправить</h3>
      <p>Проверьте связь и попробуйте ещё раз, либо позвоните нам напрямую.</p>
      <button class="btn btn-ghost" id="closeBtn" style="margin-top:16px;">Закрыть</button>
    </div>
  `;
  sheet.querySelector('#closeBtn').addEventListener('click', hideSheet);
}

function showSheet(){
  document.getElementById('backdrop').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function hideSheet(){
  document.getElementById('backdrop').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
document.getElementById('backdrop').addEventListener('click', hideSheet);

async function loadCatalog(){
  if (API_BASE){
    try {
      const [catRes, prodRes] = await Promise.all([
        fetch(`${API_BASE}/api/categories`),
        fetch(`${API_BASE}/api/products`),
      ]);
      if (!catRes.ok || !prodRes.ok) throw new Error('bad response');
      state.categories = await catRes.json();
      state.products = await prodRes.json();
      state.isDemo = false;
      document.getElementById('updatedAt').textContent = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('demoBanner').style.display = 'none';
      return;
    } catch (e) {
      console.warn('Не удалось загрузить реальный каталог, показываю демо-данные', e);
    }
  }
  state.categories = DEMO_DATA.categories;
  state.products = DEMO_DATA.products;
  state.isDemo = true;
  document.getElementById('updatedAt').textContent = 'демо';
  document.getElementById('demoBanner').style.display = 'block';
}

(async function init(){
  initPlatformBridge();
  renderBarcode();
  await loadCatalog();
  renderTabs();
  renderList();
})();
</script>
